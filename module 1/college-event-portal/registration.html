<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - College Event Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>College Event Portal</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="registration.html">Registration</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section>

    <h2>Event Registration</h2>

    <div class="form-container">

        <form id="registrationForm">

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label for="department">Department</label>
            <select id="department">
                <option value="">Select Department</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
            </select>

            <label for="year">Year</label>
            <select id="year">
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <label for="event">Select Event</label>
            <select id="event">
                <option value="">Select Event</option>
                <option value="Coding Challenge">Coding Challenge</option>
                <option value="Quiz Competition">Quiz Competition</option>
                <option value="Dance Competition">Dance Competition</option>
                <option value="Singing Competition">Singing Competition</option>
                <option value="Photography Contest">Photography Contest</option>
                <option value="Debugging Contest">Debugging Contest</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" rows="5"
                placeholder="Enter your message"></textarea>

            <button type="submit">Submit Registration</button>

            <p id="formMessage"></p>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 College Event Portal</p>
</footer>

<script src="script.js"></script>

</body>
</html>
